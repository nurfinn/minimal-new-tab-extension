name: Validate browser releases

on:
  pull_request:
  push:
    branches:
      - main
      - "firefox/**"
      - "codex/**"

permissions:
  contents: read

jobs:
  tests:
    name: Unit and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/*.test.mjs

  chrome-release:
    name: Chrome release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build Chrome archive
        run: |
          node scripts/build-chrome.mjs \
            --output-dir "$RUNNER_TEMP/minimal-new-tab-chrome" \
            --archive "$RUNNER_TEMP/minimal-new-tab-chrome-v1.7.zip"
          unzip -t "$RUNNER_TEMP/minimal-new-tab-chrome-v1.7.zip"

  browser-regressions:
    name: Review regressions in Chromium and Firefox
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned test browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-qa" --no-package-lock --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/browser-qa/node_modules/playwright/cli.js" install --with-deps chromium firefox
      - name: Run cross-browser and native extension regressions
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser-qa/node_modules/playwright/index.js"
          node scripts/verify-review-regressions.mjs all
          node scripts/verify-review-native-chrome.mjs
      - name: Retain diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-reports
          path: |
            /tmp/minimal-tab-review-regressions-*/report.json
            /tmp/minimal-tab-native-review-*/report.json
          if-no-files-found: ignore

  firefox-release:
    name: Firefox release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build Firefox archive
        run: |
          node scripts/build-firefox.mjs \
            --output-dir "$RUNNER_TEMP/minimal-new-tab-firefox" \
            --archive "$RUNNER_TEMP/minimal-new-tab-firefox-v1.7.zip"
          unzip -t "$RUNNER_TEMP/minimal-new-tab-firefox-v1.7.zip"
      - name: Lint Firefox package
        run: >-
          npx --yes --cache "$RUNNER_TEMP/npm-cache" web-ext@10.5.0 lint
          --source-dir "$RUNNER_TEMP/minimal-new-tab-firefox"
