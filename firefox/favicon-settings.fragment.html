<section class="favicon-settings-row" id="faviconSettingsRow" aria-labelledby="faviconSettingsTitle">
  <label class="settings-preference favicon-settings-switch" for="remoteFaviconToggle">
    <span class="settings-preference-copy">
      <span class="settings-preference-title" id="faviconSettingsTitle" data-i18n="siteIconsRemoteToggle">Load missing site icons</span>
      <span class="settings-help" id="faviconSettingsPrivacy" data-i18n="siteIconsPrivacy">Sends only the domain to Google. Applies immediately.</span>
    </span>
    <span class="favicon-permission-control">
      <span class="visually-hidden" id="remoteFaviconStatus" role="status" aria-live="polite">Off</span>
      <span class="settings-switch-control">
        <input id="remoteFaviconToggle" type="checkbox" aria-describedby="faviconSettingsPrivacy remoteFaviconStatus faviconSettingsError">
        <span class="settings-switch-track" aria-hidden="true"></span>
      </span>
    </span>
  </label>
  <p class="settings-error" id="faviconSettingsError" role="status" hidden></p>
</section>
